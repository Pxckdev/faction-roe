<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLS V2 | Faction Rules of Engagement</title>
<meta name="description" content="Stories of Los Santos V2 Faction Rules of Engagement.">
<link rel="icon" type="image/png" href="favicon.png">
<script>
  // Apply saved/system theme before paint to avoid a flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem('sols-roe-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = 'dark';
    document.documentElement.dataset.theme = t;
    document.documentElement.classList.add('js');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;800;900&family=Dancing+Script:wght@700&display=swap">
<style>
  :root {
    --display: 'Unbounded', 'Arial Black', Impact, sans-serif;
    --body: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    --script: 'Dancing Script', cursive;
    --bar-h: 64px;
    --col: 920px;
    --ease: cubic-bezier(.22, 1, .36, 1);

    /* Sols palette */
    --red: #ff3b3b;
    --green: #2ee86a;
    --yellow: #ffcc2e;
    --blue: #3b82ff;
    --purple: #8b5cf6;
    --t1: #3b82ff;
    --t15: #c13bff;
    --t2: #ff2b2b;

    color-scheme: dark;
    --bg: #09090b;
    --text: #f4f4f5;
    --text-soft: rgba(244, 244, 245, .88);
    --text-muted: rgba(244, 244, 245, .66);
    --panel: #111113;
    --row: #0b0b0d;
    --border: rgba(63, 63, 70, .45);
    --border-strong: rgba(82, 82, 91, .7);
    --control: rgba(24, 24, 27, .7);
    --control-hover: #27272a;
    --accent: #ed1717;
    --accent-soft: rgba(237, 23, 23, .07);
    --accent-ring: rgba(237, 23, 23, .35);
    --focus: #fafafa;
    --shadow: 0 20px 40px rgba(0, 0, 0, .5);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f4f5;
    --text: #09090b;
    --text-soft: rgba(9, 9, 11, .86);
    --text-muted: rgba(9, 9, 11, .64);
    --panel: #ffffff;
    --row: #fafafa;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --control: #ffffff;
    --control-hover: #f4f4f5;
    --accent-soft: rgba(237, 23, 23, .045);
    --accent-ring: rgba(237, 23, 23, .25);
    --focus: #09090b;
    --shadow: 0 20px 40px rgba(9, 9, 11, .12);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 16px;
    line-height: 26px;
    transition: background-color .3s ease, color .3s ease;
  }

  a { color: inherit; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
  .skip { position: absolute; left: 16px; top: -100px; padding: 8px 12px; background: var(--text); color: var(--bg); border-radius: 8px; z-index: 30; }
  .skip:focus { top: 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .progress { position: fixed; inset: 0 0 auto; height: 3px; z-index: 25; pointer-events: none; }
  .progress span { display: block; height: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); }

  /* ---------- Top controls ---------- */
  .top-btns { position: absolute; top: 24px; left: 24px; right: 24px; display: flex; justify-content: flex-end; gap: 8px; pointer-events: none; }
  .top-btns > * { pointer-events: auto; }
  .pill-btn {
    font-size: 14px; line-height: 20px; font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--control);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background-color .2s ease, border-color .2s ease, transform .15s var(--ease);
  }
  .pill-btn:hover { background: var(--control-hover); border-color: var(--border-strong); }
  .pill-btn:active { transform: scale(.96); }
  .pill-btn svg { width: 16px; height: 16px; transition: transform .5s var(--ease); }
  .theme-btn:hover svg { transform: rotate(25deg); }
  :root[data-theme="dark"] .i-moon, :root[data-theme="light"] .i-sun { display: none; }

  /* ---------- Hero ---------- */
  .hero { position: relative; max-width: var(--col); margin: 0 auto; padding: 84px 24px 8px; text-align: center; }
  .logo { display: block; width: 190px; height: auto; margin: 0 auto 10px; user-select: none; }
  .kicker {
    display: inline-block;
    font: 700 12px/16px var(--display); letter-spacing: .16em;
    padding: 6px 14px; border-radius: 999px;
    background: var(--accent); color: #fff;
    box-shadow: 0 0 18px var(--accent-ring);
  }
  h1 {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(1.7rem, .8rem + 3.6vw, 3.1rem);
    line-height: 1.06;
    letter-spacing: -.01em;
    margin: 16px 0 0;
    overflow-wrap: break-word;
  }
  .tagline { margin: 6px 0 0; font-family: var(--script); font-size: clamp(1.6rem, 1.2rem + 1vw, 2.2rem); line-height: 1.2; }
  .subtitle { margin: 12px auto 0; max-width: 560px; font-size: 16px; line-height: 25px; color: var(--text-muted); }
  .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
  .stats span {
    font-size: 13px; line-height: 18px; font-weight: 600;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--control);
  }
  .stats b { color: var(--accent); }

  /* Christmas light string */
  .lights {
    height: 26px; max-width: 460px; margin: 26px auto 0;
    background:
      radial-gradient(circle at 50% 70%, var(--red) 0 5px, transparent 6px) 0 0 / 104px 26px,
      radial-gradient(circle at 50% 70%, var(--green) 0 5px, transparent 6px) 26px 0 / 104px 26px,
      radial-gradient(circle at 50% 70%, var(--yellow) 0 5px, transparent 6px) 52px 0 / 104px 26px,
      radial-gradient(circle at 50% 70%, var(--blue) 0 5px, transparent 6px) 78px 0 / 104px 26px;
    background-repeat: repeat-x;
    border-top: 2px solid rgba(30, 80, 40, .9);
    border-radius: 50% 50% 0 0 / 14px 14px 0 0;
    filter: drop-shadow(0 0 6px rgba(255, 220, 120, .6));
  }

  /* ---------- Contents grid ---------- */
  .contents { max-width: var(--col); margin: 0 auto; padding: 28px 24px 0; }
  .contents-title { margin: 0 0 12px; text-align: center; font-size: 12px; line-height: 18px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--text-muted); }
  .toc-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .toc-list a {
    position: relative; overflow: hidden;
    display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center;
    height: 100%;
    padding: 12px 16px 12px 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--panel);
    font-size: 15px; line-height: 21px; font-weight: 600;
    text-decoration: none;
    transition: border-color .2s ease, transform .25s var(--ease), box-shadow .25s ease;
  }
  .toc-list a span {
    display: grid; place-items: center;
    width: 40px; height: 40px; border-radius: 11px;
    font: 800 13px/1 var(--display);
    color: #fff;
    background: var(--accent);
    box-shadow: 0 6px 16px var(--accent-ring);
  }
  .toc-list a:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow); }

  /* ---------- Search ---------- */
  .search { max-width: var(--col); margin: 0 auto; padding: 18px 24px 0; }
  .search-box { position: relative; }
  .search-box svg { position: absolute; left: 16px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .search input {
    width: 100%; height: 50px;
    padding: 0 16px 0 46px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--panel);
    font-size: 15px;
  }
  .search input::placeholder { color: var(--text-muted); }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
  .search-info { min-height: 20px; margin: 8px 0 0; text-align: center; font-size: 13px; color: var(--text-muted); }

  /* ---------- Sticky jump bar ---------- */
  .toc-bar {
    position: sticky; top: 0; z-index: 20;
    height: var(--bar-h);
    margin-top: 12px;
    padding: 12px 24px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid transparent;
    transition: border-color .3s ease;
  }
  .toc-bar.stuck { border-bottom-color: var(--border); }
  .toc-bar-in { position: relative; max-width: calc(var(--col) - 48px); margin: 0 auto; display: flex; gap: 8px; }
  .toc-home { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--control); display: grid; place-items: center; overflow: hidden; }
  .toc-home img { width: 30px; height: 30px; object-fit: contain; }
  .toc-toggle {
    flex: 1; min-width: 0; height: 40px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--control);
    cursor: pointer;
    font-size: 14px; line-height: 20px;
    transition: border-color .2s ease, background-color .2s ease;
  }
  .toc-toggle:hover { border-color: var(--border-strong); background: var(--control-hover); }
  .toc-toggle .k { color: var(--text-muted); flex-shrink: 0; }
  .toc-current { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .toc-current-num { font-family: var(--display); font-size: 12px; color: #fff; background: var(--accent); padding: 2px 8px; border-radius: 6px; flex-shrink: 0; }
  .toc-toggle svg { width: 16px; height: 16px; flex-shrink: 0; transition: transform .3s var(--ease); }
  .toc-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .toc-drop {
    position: absolute; left: 48px; right: 0; top: calc(100% + 8px);
    max-height: 70vh; overflow: auto;
    padding: 8px;
    border-radius: 16px;
    border: 1px solid var(--border-strong);
    background: color-mix(in srgb, var(--bg) 94%, transparent);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: var(--shadow);
    opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.985); transform-origin: 50% 0;
    transition: opacity .2s ease, transform .25s var(--ease), visibility 0s linear .25s;
  }
  .toc-drop.open { opacity: 1; visibility: visible; transform: none; transition: opacity .2s ease, transform .25s var(--ease), visibility 0s; }
  .toc-drop ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .toc-drop a {
    position: relative;
    display: grid; grid-template-columns: 34px 1fr; gap: 6px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 15px; line-height: 22px;
    color: var(--text-muted);
    text-decoration: none;
    transition: background-color .15s ease, color .15s ease;
  }
  .toc-drop a span { color: var(--accent); font: 800 12px/22px var(--display); }
  .toc-drop a:hover { color: var(--text); background: var(--control-hover); }
  .toc-drop a.active { color: var(--text); background: var(--row); }
  .toc-drop a.active::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--accent); }
  html:not(.js) .toc-bar, html:not(.js) .search { display: none; }

  /* ---------- Main column ---------- */
  .main { max-width: var(--col); margin: 0 auto; padding: 24px 24px 56px; }
  .main:focus { outline: none; }

  /* Section cards: glass with a red/purple edge and a big outlined number */
  .doc { display: grid; gap: 26px; counter-reset: sec; }
  .doc > section {
    counter-increment: sec;
    position: relative; overflow: hidden;
    min-width: 0;
    padding: 34px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    transition: border-color .3s ease;
  }
  .doc > section::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--accent);
  }
  .doc > section::after {
    content: counter(sec, decimal-leading-zero);
    position: absolute; right: 22px; top: 6px;
    font: 900 92px/1 var(--display);
    color: transparent;
    -webkit-text-stroke: 1px var(--border-strong);
    opacity: .55;
    pointer-events: none;
  }
  section[id], .sub[id] { scroll-margin-top: calc(var(--bar-h) + 20px); }

  .sec-head { position: relative; padding: 0 56px 22px 0; border-bottom: 1px solid var(--border); }
  h2.sec {
    font-family: var(--display);
    font-weight: 800;
    text-transform: uppercase;
    font-size: clamp(1.15rem, .85rem + 1.6vw, 1.75rem);
    line-height: 1.2;
    margin: 0;
    overflow-wrap: break-word;
  }
  h2.sec::before {
    content: "Section " counter(sec, decimal-leading-zero);
    display: table;
    margin-bottom: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    font-family: var(--body); font-weight: 700;
    font-size: 11px; line-height: 16px; letter-spacing: .14em;
    color: #fff; background: var(--accent);
  }
  .copy-wrap { position: absolute; top: 0; right: 0; display: flex; align-items: center; z-index: 1; }
  .copy {
    width: 36px; height: 36px;
    display: inline-grid; place-items: center;
    padding: 0;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--control);
    cursor: pointer;
    transition: color .2s ease, background-color .2s ease, border-color .2s ease, transform .15s var(--ease);
  }
  .copy:hover { color: var(--text); background: var(--control-hover); border-color: var(--border-strong); }
  .copy:active { transform: scale(.92); }
  .copy svg { width: 16px; height: 16px; }
  .copied {
    position: absolute; right: 44px; top: 50%;
    white-space: nowrap;
    font-size: 12px; line-height: 16px; font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    color: var(--text); background: var(--bg); border: 1px solid var(--border-strong);
    opacity: 0; pointer-events: none;
    transform: translate(6px, -50%);
    transition: opacity .2s ease, transform .3s var(--ease);
  }
  .copied.show { opacity: 1; transform: translate(0, -50%); }

  .doc p { margin: 16px 0 0; color: var(--text-soft); }
  .sec-head + p { margin-top: 22px; }
  .doc strong { color: var(--text); font-weight: 700; }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .badge {
    display: inline-block;
    font-size: 12px; line-height: 16px; font-weight: 700;
    padding: 4px 11px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--row);
    color: var(--text-soft);
    white-space: nowrap;
  }

  /* Subsections */
  .sub { margin-top: 30px; padding-top: 26px; border-top: 1px dashed var(--border); }
  .sec-head + .sub { margin-top: 0; border-top: 0; }
  .sub-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  h3 { font-family: var(--body); font-size: 19px; line-height: 27px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 10px; }
  h3::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 10px var(--accent-ring); transform: rotate(45deg); }
  .sub-head + p { margin-top: 14px; }

  /* Rule rows with Christmas-light bullets */
  .rules { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
  .rules > li {
    position: relative;
    padding: 12px 16px 12px 38px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--row);
    color: var(--text-soft);
    overflow-wrap: break-word;
    transition: border-color .2s ease, transform .25s var(--ease), background-color .2s ease;
  }
  .rules > li:hover { border-color: var(--border-strong); transform: translateX(3px); }
  .rules > li::before { content: ""; position: absolute; left: 16px; top: 22px; width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); opacity: .7; transition: background-color .2s ease, opacity .2s ease; }
  .rules > li:hover::before { background: var(--accent); opacity: 1; }
  .rules ul { margin: 8px 0 0; padding-left: 4px; list-style: none; display: grid; gap: 6px; }
  .rules ul li { position: relative; padding-left: 18px; }
  .rules ul li::before { content: "›"; position: absolute; left: 2px; color: var(--accent); font-weight: 700; }

  /* Callouts */
  .callout {
    margin-top: 16px;
    padding: 14px 16px 14px 18px;
    border-radius: 12px;
    border: 1px solid var(--border-strong);
    background: var(--row);
    border-left-width: 3px;
  }
  .callout p { margin: 6px 0 0; }
  .callout .label + p { margin-top: 2px; }
  .callout .label { display: block; font-size: 13px; line-height: 20px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
  .callout .rules { margin-top: 8px; }
  .callout .rules > li { background: transparent; }
  .callout.warn { border-color: var(--accent-ring); background: var(--accent-soft); }
  .callout.warn .label { color: var(--accent); }
  .rules > li .callout { margin-top: 12px; }

  /* Tier track (blue / purple / red like the Faction Helper) */
  .stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
  .stages .sub {
    --c: var(--t1);
    position: relative;
    margin: 0; padding: 20px 18px;
    border: 1px solid var(--border);
    border-top: 3px solid var(--c);
    border-radius: 16px;
    background: var(--row);
    transition: transform .25s var(--ease), box-shadow .25s ease;
  }
  .stages .sub:nth-child(2) { --c: var(--t15); }
  .stages .sub:nth-child(3) { --c: var(--t2); }
  .stages .sub:hover { transform: translateY(-3px); border-color: var(--border-strong); border-top-color: var(--c); }
  .stages .sub-head { flex-direction: column; align-items: flex-start; }
  .stages h3 { font-family: var(--display); font-size: 17px; }
  .stages h3::before { background: var(--c); box-shadow: 0 0 10px var(--c); }
  .stages .sub p { margin-top: 12px; font-size: 15px; line-height: 24px; }

  /* Attack type quick links */
  .chips { list-style: none; margin: 18px 0 4px; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .chips a {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    height: 100%;
    padding: 14px 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--row);
    font-size: 14px; line-height: 20px; font-weight: 700;
    text-align: center;
    text-decoration: none;
    transition: border-color .2s ease, background-color .2s ease, transform .25s var(--ease);
  }
  .chips a::after { content: "↓"; color: var(--accent); font-weight: 700; transition: transform .25s var(--ease); }
  .chips a:hover { border-color: var(--accent-ring); background: var(--accent-soft); transform: translateY(-2px); }
  .chips a:hover::after { transform: translateY(3px); }

  /* Search results */
  .s-hide { display: none !important; }
  .s-hit { border-color: var(--accent) !important; box-shadow: 0 0 0 1px var(--accent-ring); }

  footer { margin-top: 40px; text-align: center; font-size: 14px; color: var(--text-muted); }
  footer img { display: block; width: 84px; margin: 0 auto 10px; opacity: .9; }
  footer .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 14px 0; }
  footer .links a { text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--control); font-weight: 600; font-size: 13px; }
  footer .links a:hover { border-color: var(--border-strong); }

  /* ---------- Motion ---------- */
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: no-preference) {
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes drop-in { from { opacity: 0; transform: translateY(-10px) scale(.94); } to { opacity: 1; transform: none; } }
    @keyframes twinkle { 50% { filter: drop-shadow(0 0 12px rgba(255, 220, 120, .9)); opacity: .82; } }
    .hero .logo { animation: drop-in .9s var(--ease) both; }
    .hero .kicker, .hero h1 { animation: rise .8s var(--ease) .12s both; }
    .hero .tagline, .hero .subtitle, .hero .stats { animation: rise .8s var(--ease) .22s both; }
    .lights { animation: rise .8s var(--ease) .3s both, twinkle 2.4s ease-in-out 1.1s infinite; }
    .contents, .search { animation: rise .8s var(--ease) .34s both; }

    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .7s var(--ease); transition-delay: var(--d, 0s); }
    .reveal.in { opacity: 1; transform: none; }
    .rules > li.reveal.in { transition: opacity .6s ease, transform .7s var(--ease), border-color .2s ease; transition-delay: var(--d, 0s), var(--d, 0s), 0s; }

    @keyframes ring { 0% { box-shadow: 0 0 0 0 var(--accent-ring); border-color: var(--accent); } 70% { box-shadow: 0 0 0 12px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    .doc > section.flash, .stages .sub.flash { animation: ring 1.4s var(--ease); }
    .sub.flash > .sub-head { animation: rise .6s var(--ease); }
    .doc > section.flash h2.sec { animation: rise .6s var(--ease); }
  }

  @media (max-width: 760px) {
    :root { --bar-h: 60px; }
    .top-btns { top: 14px; left: 14px; right: 14px; }
    .pill-btn .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .pill-btn { padding: 8px 10px; }
    .hero { padding: 66px 16px 4px; }
    .logo { width: 132px; }
    .contents, .search { padding-left: 16px; padding-right: 16px; }
    .toc-list { grid-template-columns: minmax(0, 1fr); }
    .toc-bar { padding: 10px 16px; }
    .toc-toggle .k { display: none; }
    .main { padding: 16px 16px 40px; }
    .doc { gap: 18px; }
    .doc > section { padding: 26px 18px 22px 22px; }
    .doc > section::after { font-size: 64px; right: 14px; }
    .sec-head { padding-right: 44px; }
    h3 { font-size: 17px; line-height: 25px; }
    .rules > li { padding: 10px 12px 10px 30px; }
    .rules > li::before { left: 12px; top: 19px; width: 7px; height: 7px; }
    .callout { padding: 12px; }
    .stages, .chips { grid-template-columns: minmax(0, 1fr); }
  }
  @media (min-width: 761px) and (max-width: 900px) {
    .chips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media print {
    :root, :root[data-theme] {
      --bg: #fff; --text: #000; --text-soft: #111; --text-muted: #444;
      --panel: #fff; --row: #fff; --border: #ccc; --border-strong: #999; --bar-h: 0px;
    }
    html { scroll-behavior: auto; }
    body { font-size: 11pt; line-height: 1.5; }
    .top-btns, .contents, .search, .toc-bar, .copy-wrap, .chips, footer, .skip, .progress, .lights { display: none !important; }
    .hero, .main { max-width: none; padding: 0; }
    .logo { width: 90px; }
    .doc { display: block; }
    .doc > section { border: 0; padding: 0; margin-top: 28px; }
    .doc > section::before, .doc > section::after { display: none; }
    .stages { grid-template-columns: 1fr; }
    .reveal { opacity: 1 !important; transform: none !important; }
    .rules > li, .callout, .stages .sub { break-inside: avoid; page-break-inside: avoid; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><span></span></div>
<a class="skip" href="#rules">Skip to rules</a>

<header class="hero" id="top">
  <div class="top-btns">
    <button type="button" class="pill-btn theme-btn" id="theme-btn">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="lbl">Light mode</span>
    </button>
  </div>
  <img class="logo" src="logo.png" width="420" height="441" alt="Sols" draggable="false">
  <span class="kicker" id="cfg-kicker"></span>
  <h1 id="cfg-title"></h1>
  <p class="tagline" id="cfg-tagline"></p>
  <p class="subtitle" id="cfg-subtitle"></p>
  <div class="stats" id="cfg-stats"></div>
  <div class="lights" aria-hidden="true"></div>
</header>

<nav class="contents" aria-labelledby="contents-title">
  <h2 class="contents-title" id="contents-title">Jump to section</h2>
  <ol class="toc-list" id="toc-list"></ol>
</nav>

<div class="search" role="search">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="rule-search" placeholder="Search the rules… (try &quot;robbery&quot;, &quot;POV&quot; or &quot;cooldown&quot;)" aria-label="Search the rules" autocomplete="off">
  </div>
  <p class="search-info" id="search-info" aria-live="polite"></p>
</div>

<div class="toc-bar" id="toc-bar">
  <div class="toc-bar-in">
    <a class="toc-home" href="#top" id="to-top-bar" aria-label="Back to top"><img src="favicon.png" alt=""></a>
    <button type="button" class="toc-toggle" id="toc-toggle" aria-expanded="false" aria-controls="toc-drop">
      <span class="k">Jump to</span>
      <span class="toc-current-num" id="toc-current-num">01</span>
      <span class="toc-current" id="toc-current"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <nav class="toc-drop" id="toc-drop" aria-label="Jump to section"></nav>
  </div>
</div>

<main class="main" id="rules" tabindex="-1">
  <article class="doc" id="doc">
    <noscript><p>Turn on JavaScript to see the rules.</p></noscript>
  </article>
  <footer>
    <img src="logo.png" alt="">
    <div id="cfg-footer-note"></div>
    <div class="links" id="cfg-footer-links"></div>
    <a href="#top" id="to-top">Back to top ↑</a>
  </footer>
</main>
<div class="sr-only" aria-live="polite" id="live"></div>

<!-- All the rules and text live in config.js -->
<script src="config.js"></script>
<script>
  // ===== Build the page from config.js =====
  (function () {
    var C = window.ROE;
    var doc = document.getElementById('doc');
    if (!C || !Array.isArray(C.sections)) {
      doc.innerHTML = '<section><div class="sec-head"><h2 class="sec">config.js has a mistake</h2></div><p>The rules couldn\'t load. Open config.js and check for a missing quote, comma or bracket near your last change. Press F12 → Console to see which line.</p></section>';
      return;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    // **bold** and [text](https://link)
    function fmt(s) {
      return esc(s)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }
    var used = {};
    function makeId(s) {
      var base = String(s).toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'section';
      var id = base, n = 2;
      while (used[id]) id = base + '-' + n++;
      used[id] = true;
      return id;
    }
    var list = function (v) { return v == null ? [] : Array.isArray(v) ? v : [v]; };

    function callout(c) {
      return '<div class="callout' + (c.warn ? ' warn' : '') + '">' +
        (c.note ? '<span class="label">' + fmt(c.note) + '</span>' : '') +
        list(c.text).map(function (p) { return '<p>' + fmt(p) + '</p>'; }).join('') +
        (c.rules ? rules(c.rules) : '') +
        '</div>';
    }
    function rules(items) {
      return '<ul class="rules">' + list(items).map(function (r) {
        if (typeof r === 'string') return '<li>' + fmt(r) + '</li>';
        return '<li>' + fmt(r.text) +
          (r.sub ? '<ul>' + list(r.sub).map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul>' : '') +
          (r.callout ? callout(r.callout) : '') +
          '</li>';
      }).join('') + '</ul>';
    }
    function blocks(items, subs) {
      return list(items).map(function (b) {
        if (typeof b === 'string') return '<p>' + fmt(b) + '</p>';
        if (!b || typeof b !== 'object') return '';
        if (b.rules && b.note === undefined) return rules(b.rules);
        if (b.note !== undefined || b.text !== undefined) return callout(b);
        if (b.badges) return '<div class="badges">' + list(b.badges).map(function (x) { return '<span class="badge">' + fmt(x) + '</span>'; }).join('') + '</div>';
        if (b.jumpLinks) return '<ul class="chips" aria-label="Jump to">' + subs.map(function (s) { return '<li><a href="#' + s.id + '">' + fmt(s.title) + '</a></li>'; }).join('') + '</ul>';
        if (b.tiers) return '<div class="stages">' + list(b.tiers).map(function (t) {
          return '<div class="sub" id="' + makeId(t.name) + '"><div class="sub-head"><h3>' + fmt(t.name) + '</h3>' +
            (t.badge ? '<span class="badge">' + fmt(t.badge) + '</span>' : '') + '</div>' +
            list(t.text).map(function (p) { return '<p>' + fmt(p) + '</p>'; }).join('') + '</div>';
        }).join('') + '</div>';
        return '';
      }).join('');
    }

    var toc = [];
    doc.innerHTML = C.sections.map(function (sec, i) {
      var id = makeId(sec.title);
      var num = (i < 9 ? '0' : '') + (i + 1);
      toc.push('<li><a href="#' + id + '"><span>' + num + '</span>' + fmt(sec.title) + '</a></li>');
      var subs = list(sec.subsections).map(function (s) { return { id: makeId(s.title), title: s.title, data: s }; });
      return '<section id="' + id + '" aria-labelledby="h-' + id + '">' +
        '<div class="sec-head"><h2 class="sec" id="h-' + id + '">' + fmt(sec.title) + '</h2></div>' +
        blocks(sec.content, subs) +
        subs.map(function (s) {
          return '<div class="sub" id="' + s.id + '"><div class="sub-head"><h3>' + fmt(s.title) + '</h3>' +
            (s.data.badge ? '<span class="badge">' + fmt(s.data.badge) + '</span>' : '') + '</div>' +
            blocks(s.data.content, subs) + '</div>';
        }).join('') +
        '</section>';
    }).join('');
    document.getElementById('toc-list').innerHTML = toc.join('');

    // Top and bottom of the page
    var set = function (id, v) { var el = document.getElementById(id); if (v) el.innerHTML = fmt(v); else el.remove(); };
    if (C.pageTitle) document.title = C.pageTitle;
    set('cfg-kicker', C.kicker);
    set('cfg-title', C.title);
    set('cfg-tagline', C.tagline);
    set('cfg-subtitle', C.subtitle);
    set('cfg-footer-note', C.footerNote);
    var stats = [{ value: C.sections.length, label: 'sections' }].concat(list(C.stats));
    document.getElementById('cfg-stats').innerHTML = stats.map(function (s) { return '<span><b>' + esc(s.value) + '</b> ' + esc(s.label) + '</span>'; }).join('');
    document.getElementById('cfg-footer-links').innerHTML = list(C.footerLinks).map(function (l) { return '<a href="' + esc(l.url) + '">' + esc(l.label) + '</a>'; }).join('');
  })();
</script>
<script>
  (function () {
    if (!document.querySelector('.doc > section[id]')) return;
    var root = document.documentElement;
    var motionOK = matchMedia('(prefers-reduced-motion: no-preference)');

    // Theme toggle
    var btn = document.getElementById('theme-btn');
    var lbl = btn.querySelector('.lbl');
    function sync() {
      var dark = root.dataset.theme === 'dark';
      lbl.textContent = dark ? 'Light mode' : 'Dark mode';
      btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    btn.addEventListener('click', function () {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('sols-roe-theme', root.dataset.theme); } catch (e) {}
      sync();
    });
    sync();

    function toTop(e) {
      e.preventDefault();
      history.replaceState(null, '', location.pathname + location.search);
      window.scrollTo({ top: 0, behavior: motionOK.matches ? 'smooth' : 'auto' });
    }
    document.getElementById('to-top').addEventListener('click', toTop);
    document.getElementById('to-top-bar').addEventListener('click', toTop);

    // Sticky jump bar: its dropdown reuses the contents list
    var bar = document.getElementById('toc-bar');
    var drop = document.getElementById('toc-drop');
    var toggle = document.getElementById('toc-toggle');
    var list = document.getElementById('toc-list').cloneNode(true);
    list.removeAttribute('id'); list.className = '';
    drop.appendChild(list);
    function setOpen(open) {
      drop.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', String(open));
    }
    toggle.addEventListener('click', function () { setOpen(!drop.classList.contains('open')); });
    drop.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && drop.classList.contains('open')) { setOpen(false); toggle.focus(); }
    });
    document.addEventListener('click', function (e) {
      if (drop.classList.contains('open') && !drop.contains(e.target) && !toggle.contains(e.target)) setOpen(false);
    });

    // Current section, reading progress, stuck state
    var sections = [].slice.call(document.querySelectorAll('.doc > section[id]'));
    var links = {};
    drop.querySelectorAll('a').forEach(function (a) { links[a.getAttribute('href').slice(1)] = a; });
    var current = document.getElementById('toc-current');
    var currentNum = document.getElementById('toc-current-num');
    var progress = document.querySelector('.progress span');
    var ticking = false;
    function onScroll() {
      ticking = false;
      var visible = sections.filter(function (s) { return !s.classList.contains('s-hide'); });
      if (!visible.length) return;
      var line = window.innerHeight * 0.3, active = visible[0];
      visible.forEach(function (s) { if (s.getBoundingClientRect().top <= line) active = s; });
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) active = visible[visible.length - 1];
      var idx = sections.indexOf(active);
      Object.keys(links).forEach(function (id) {
        var on = id === active.id;
        links[id].classList.toggle('active', on);
        on ? links[id].setAttribute('aria-current', 'true') : links[id].removeAttribute('aria-current');
      });
      current.textContent = active.querySelector('h2').textContent;
      currentNum.textContent = (idx < 9 ? '0' : '') + (idx + 1);
      bar.classList.toggle('stuck', bar.getBoundingClientRect().top <= 0);
      var max = document.documentElement.scrollHeight - window.innerHeight;
      progress.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, window.scrollY / max) : 0) + ')';
    }
    window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
    window.addEventListener('resize', onScroll);
    onScroll();

    // Highlight pulse on whatever an in-page link jumps to
    function flash(id) {
      var el = id && document.getElementById(id);
      if (!el || !el.matches('.doc > section, .sub')) return;
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      clearTimeout(el._flashT);
      el._flashT = setTimeout(function () { el.classList.remove('flash'); }, 1600);
    }
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[href^="#"]');
      if (a && a.id !== 'to-top' && a.id !== 'to-top-bar') flash(a.getAttribute('href').slice(1));
    });
    window.addEventListener('hashchange', function () { flash(location.hash.slice(1)); });

    // ===== Rule search =====
    // Hides everything that doesn't mention the search words. A matching section or
    // subsection title keeps that whole block visible.
    var search = document.getElementById('rule-search');
    var info = document.getElementById('search-info');
    var units = [].slice.call(document.querySelectorAll('.doc .rules > li, .doc section > p, .doc .sub > p, .doc .callout, .doc .chips, .doc .badges'))
      .filter(function (el) {
        return !(el.closest('.callout') && !el.matches('.callout')) && !el.closest('.rules > li .callout, .rules > li li');
      });
    var subs = [].slice.call(document.querySelectorAll('.doc .sub'));
    function norm(s) { return s.toLowerCase().replace(/\s+/g, ' '); }
    var searchTimer;
    function runSearch() {
      var q = norm(search.value.trim());
      document.querySelectorAll('.s-hide, .s-hit').forEach(function (el) { el.classList.remove('s-hide', 's-hit'); });
      if (!q) { info.textContent = ''; onScroll(); return; }
      var words = q.split(' ');
      var has = function (el) { var t = norm(el.textContent); return words.every(function (w) { return t.indexOf(w) !== -1; }); };
      var count = 0;
      units.forEach(function (el) {
        if (has(el)) { if (el.matches('.rules > li, .callout')) { el.classList.add('s-hit'); count++; } else if (el.matches('p')) count++; }
        else el.classList.add('s-hide');
      });
      // keep blocks whose title matches
      subs.forEach(function (sub) {
        var h = sub.querySelector('h3');
        if (h && has(h)) { sub.querySelectorAll('.s-hide').forEach(function (el) { el.classList.remove('s-hide'); }); count++; }
      });
      sections.forEach(function (sec) {
        if (has(sec.querySelector('h2'))) { sec.querySelectorAll('.s-hide').forEach(function (el) { el.classList.remove('s-hide'); }); count++; }
      });
      // hide empty subsections / sections (anything inside an already-hidden box doesn't count)
      var shown = function (scope, sel) {
        return [].some.call(scope.querySelectorAll(sel), function (el) { return !el.closest('.s-hide'); });
      };
      subs.forEach(function (sub) {
        sub.classList.toggle('s-hide', !shown(sub, '.rules > li, p, .callout'));
      });
      sections.forEach(function (sec) {
        sec.classList.toggle('s-hide', !shown(sec, '.sub, .rules > li, p'));
      });
      info.textContent = count ? count + ' match' + (count === 1 ? '' : 'es') + ' for "' + search.value.trim() + '"' : 'No rules mention "' + search.value.trim() + '". Try another word.';
      onScroll();
    }
    search.addEventListener('input', function () { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 120); });
    search.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { search.value = ''; runSearch(); }
      if (e.key === 'Enter') { var first = document.querySelector('.doc > section:not(.s-hide)'); if (first) first.scrollIntoView({ behavior: motionOK.matches ? 'smooth' : 'auto' }); }
    });

    // Scroll reveal (skipped without IntersectionObserver or with reduced motion)
    if ('IntersectionObserver' in window && motionOK.matches) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
      }, { rootMargin: '0px 0px -6% 0px' });
      document.querySelectorAll('.sec-head, .doc p, .sub-head, .rules > li, .callout, .stages .sub, .chips li, .badges').forEach(function (el) {
        if ((el.closest('.callout') && !el.matches('.callout')) || (el.matches('.sub-head') && el.closest('.stages'))) return;
        var sib = el.parentElement ? [].indexOf.call(el.parentElement.children, el) : 0;
        el.style.setProperty('--d', Math.min(sib, 6) * 0.05 + 's');
        el.classList.add('reveal');
        io.observe(el);
      });
      window.addEventListener('beforeprint', function () { document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); }); });
    }

    // Copy-link controls, one per main section
    var live = document.getElementById('live');
    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      return ok;
    }
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(function () { if (!fallbackCopy(text)) throw new Error('copy failed'); });
      }
      return fallbackCopy(text) ? Promise.resolve() : Promise.reject();
    }
    var icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>';
    sections.forEach(function (sec) {
      var title = sec.querySelector('h2').textContent;
      var wrap = document.createElement('div');
      wrap.className = 'copy-wrap';
      wrap.innerHTML = '<span class="copied" aria-hidden="true">Link copied</span><button type="button" class="copy">' + icon + '</button>';
      var b = wrap.querySelector('button'), tip = wrap.querySelector('.copied'), timer;
      b.setAttribute('aria-label', 'Copy link to ' + title + ' section');
      b.addEventListener('click', function () {
        var url = location.href.split('#')[0] + '#' + sec.id;
        history.replaceState(null, '', '#' + sec.id);
        function done(msg) {
          tip.textContent = msg; tip.classList.add('show'); live.textContent = msg;
          clearTimeout(timer);
          timer = setTimeout(function () { tip.classList.remove('show'); live.textContent = ''; }, 1600);
        }
        copyText(url).then(function () { done('Link copied'); }, function () { done('Copy failed'); });
      });
      sec.querySelector('.sec-head').appendChild(wrap);
    });
  })();
</script>
</body>
</html>
